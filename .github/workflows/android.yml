# Doble Parsi V1.0.0 - release build
# Copyright (c) 2026 QW-AI-Code - https://github.com/QW-AI-Code
name: Build & release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.0

jobs:
  build:
    name: Doble Parsi V1.0.0 — release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # A stable signing key means updates install over the previous version.
      # Add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD as
      # repository secrets (see README). Without them a throwaway key is used.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Using the keystore from repository secrets."
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storetype PKCS12 \
              -alias "${KEY_ALIAS:-dobleparsi}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-dobleparsi}" \
              -keypass "${KEY_PASSWORD:-dobleparsi}" \
              -dname "CN=Doble Parsi, OU=QW-AI-Code, O=QW-AI-Code, C=IR"
            echo "::warning::No KEYSTORE_BASE64 secret found, generated a throwaway key for this build."
          fi

      # One universal APK on purpose: the app has no native libraries, so ABI
      # splits used to produce three byte-identical 41.8 MB files.
      - name: Build the release APK (universal, R8 + resource shrinking)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dobleparsi' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dobleparsi' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dobleparsi' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect and name the APK
        run: |
          set -e
          mkdir -p out
          ls -la app/build/outputs/apk/release/
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$src" "out/DobleParsi-${APP_VERSION}-universal.apk"
          cd out
          sha256sum *.apk > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      - name: Report size and native libraries
        run: |
          apk="out/DobleParsi-${APP_VERSION}-universal.apk"
          echo "### APK report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| file | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          native=$(unzip -l "$apk" | grep -c '\.so$' || true)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "native libraries (.so) inside the APK: **${native}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$native" = "0" ]; then
            echo "No native code, so per-ABI APKs would be identical to this one." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)
          for apk in out/*.apk; do
            echo "── $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DobleParsi-${{ env.APP_VERSION }}-apk
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      # Every PR build gets its own clearly labeled prerelease.
      - name: Publish Pull Request build
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-${{ github.event.pull_request.number }}-run-${{ github.run_number }}
          name: "🧪 Pull Request #${{ github.event.pull_request.number }} — Doble Parsi V${{ env.APP_VERSION }}"
          body: |
            ## 🧪 Pull Request build — not a stable release

            This APK was built automatically from Pull Request #${{ github.event.pull_request.number }}.

            - **Type:** Test / Pull Request build
            - **PR:** https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            - **Commit:** ${{ github.event.pull_request.head.sha }}

            This is a prerelease for testing. It is not the stable version.
          files: |
            out/DobleParsi-${{ env.APP_VERSION }}-universal.apk
            out/SHA256SUMS.txt
          prerelease: true
          make_latest: false

      # Update the same stable release on each successful push to main/master.
      - name: Publish or update stable GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Doble Parsi V${{ env.APP_VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            out/DobleParsi-${{ env.APP_VERSION }}-universal.apk
            out/SHA256SUMS.txt
          overwrite_files: true
          prerelease: false
          make_latest: true
